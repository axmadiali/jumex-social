<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="icon"
          href="Logo/IMG_20260507_150409.jpg">

    <title>Jumex Mall</title>


    <style>

        /* =========================
           رنگ های سازمانی جامکس
        ========================== */

        :root {
            --navy: rgb(27, 39, 84);
            --orange: rgb(238, 103, 38);
            --white: #ffffff;
            --light: #f8f9fc;
        }


        /* =========================
           تنظیمات اولیه
        ========================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background: var(--white);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            position: relative;

            overflow-x: hidden;
        }


        /* =========================
           بک گراند سرمه ای
        ========================== */

        body::before {

            content: "";

            position: fixed;

            width: 550px;
            height: 550px;

            top: -350px;
            right: -220px;

            background: var(--navy);

            border-radius: 50%;

            z-index: -2;
        }


        /* =========================
           بک گراند نارنجی
        ========================== */

        body::after {

            content: "";

            position: fixed;

            width: 600px;
            height: 600px;

            bottom: -400px;
            left: -250px;

            background: var(--orange);

            border-radius: 50%;

            z-index: -2;
        }


        /* =========================
           کارت اصلی
        ========================== */

        .container {

            width: 100%;

            max-width: 430px;

            background: rgba(255, 255, 255, 0.97);

            border: 2px solid var(--orange);

            border-radius: 30px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(27, 39, 84, 0.18);

            position: relative;

            z-index: 1;
        }


        /* =========================
           لوگو
        ========================== */

        .logo {

            width: 180px;

            max-width: 80%;

            display: block;

            margin: 0 auto 15px;

            border-radius: 10px;
        }


        /* =========================
           عنوان
        ========================== */

        h1 {

            color: var(--navy);

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 18px;

            direction: ltr;
        }


        /* =========================
           خط تزئینی
        ========================== */

        .divider {

            width: 170px;

            height: 3px;

            background: var(--orange);

            margin: 0 auto 25px;

            border-radius: 10px;

            position: relative;
        }


        .divider::after {

            content: "";

            position: absolute;

            width: 12px;

            height: 12px;

            background: var(--orange);

            border-radius: 50%;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            border: 3px solid white;
        }


        /* =========================
           متن
        ========================== */

        .description {

            color: var(--navy);

            font-size: 18px;

            font-weight: bold;

            line-height: 2;

            margin-bottom: 30px;
        }


        /* =========================
           دکمه های شبکه اجتماعی
        ========================== */

        .social-link {

            width: 100%;

            height: 75px;

            margin: 15px 0;

            padding: 10px 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            text-decoration: none;

            color: var(--navy);

            background: var(--white);

            border: 2px solid var(--navy);

            border-radius: 18px;

            box-shadow:
                0 5px 12px
                rgba(27, 39, 84, 0.08);

            transition:
                0.25s ease;
        }


        /* =========================
           آیکون
        ========================== */

        .social-icon {

            width: 50px;

            height: 50px;

            object-fit: cover;

            border-radius: 50%;

            flex-shrink: 0;
        }


        /* =========================
           اسم شبکه اجتماعی
        ========================== */

        .social-name {

            flex: 1;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            direction: ltr;
        }


        /* =========================
           فلش
        ========================== */

        .arrow {

            color: var(--orange);

            font-size: 28px;

            font-weight: bold;

            direction: ltr;

            transition: 0.25s ease;
        }


        /* =========================
           Hover
        ========================== */

        .social-link:hover {

            transform:
                translateY(-4px);

            border-color: var(--orange);

            box-shadow:
                0 10px 25px
                rgba(238, 103, 38, 0.20);

            background: #fffaf7;
        }


        .social-link:hover .arrow {

            transform:
                translateX(-5px);
        }


        /* =========================
           دایره های تزئینی
        ========================== */

        .decoration {

            position: fixed;

            border-radius: 50%;

            z-index: -1;
        }


        .orange-circle {

            width: 25px;

            height: 25px;

            border: 3px solid var(--orange);

            left: 8%;

            top: 25%;
        }


        .navy-circle {

            width: 18px;

            height: 18px;

            background: var(--navy);

            right: 8%;

            top: 35%;
        }


        .small-orange-circle {

            width: 14px;

            height: 14px;

            background: var(--orange);

            right: 12%;

            bottom: 20%;
        }


        /* =========================
           موبایل
        ========================== */

        @media (max-width: 600px) {

            body {

                padding: 25px 15px;
            }


            .container {

                padding: 30px 18px;

                border-radius: 25px;
            }


            .logo {

                width: 145px;
            }


            h1 {

                font-size: 27px;
            }


            .description {

                font-size: 16px;

                margin-bottom: 25px;
            }


            .social-link {

                height: 68px;

                padding: 8px 14px;

                border-radius: 15px;
            }


            .social-icon {

                width: 45px;

                height: 45px;
            }


            .social-name {

                font-size: 16px;
            }


            .arrow {

                font-size: 24px;
            }
        }


        /* =========================
           موبایل خیلی کوچک
        ========================== */

        @media (max-width: 380px) {

            .container {

                padding:
                    25px 15px;
            }


            .logo {

                width: 125px;
            }


            h1 {

                font-size: 24px;
            }


            .social-name {

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


    <!-- المان های تزئینی -->

    <div class="decoration orange-circle"></div>

    <div class="decoration navy-circle"></div>

    <div class="decoration small-orange-circle"></div>


    <!-- کارت اصلی -->

    <main class="container">


        <!-- لوگوی جامکس -->

        <img
            class="logo"
            src="Logo/IMG_20260507_150409.jpg"
            alt="Jumex Mall"
        >

        <div class="divider"></div>


        <!-- متن -->

        <p class="description">
            ما را در صفحات مجازی دنبال کنید
        </p>


        <!-- =========================
             Bale
        ========================== -->

        <a
            class="social-link"
            href="https://ble.ir/join/QA5PZnNkEf"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                class="social-icon"
                src="Icon/bale.jpg"
                alt="Bale"
            >

            <span class="social-name">
                Bale
            </span>

            <span class="arrow">
                ←
            </span>

        </a>


        <!-- =========================
             Telegram
        ========================== -->

        <a
            class="social-link"
            href="https://t.me/jumex_mall"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                class="social-icon"
                src="Icon/telegram-logo-1.png"
                alt="Telegram"
            >

            <span class="social-name">
                Telegram
            </span>

            <span class="arrow">
                ←
            </span>

        </a>


        <!-- =========================
             Instagram
        ========================== -->

        <a
            class="social-link"
            href="https://instagram.com/jumex.ir"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                class="social-icon"
                src="Icon/instagram-logo-1.png"
                alt="Instagram"
            >

            <span class="social-name">
                Instagram
            </span>

            <span class="arrow">
                ←
            </span>

        </a>


    </main>


</body>

</html>
